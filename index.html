<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameChanger</title>
  <meta name="description" content="GameChanger — reputation strategy. Coming soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <link rel="canonical" href="https://higamechanger.com/">
  <meta name="theme-color" content="#171310">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://higamechanger.com/">
  <meta property="og:title" content="GameChanger">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:image" content="https://higamechanger.com/images/brand/social-share-oxblood.png">
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #171310;
      --cream: #F4F0E7;
      --terracotta: #D98A6A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(217, 138, 106, 0.1), transparent 55%),
        var(--ink);
      color: var(--cream);
      font-family: "Newsreader", Georgia, serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    .wordmark {
      height: 22px;
      width: auto;
      display: block;
      margin: 0 auto 48px;
      opacity: 0.95;
    }
    .rule {
      width: 40px;
      height: 1px;
      background: var(--terracotta);
      margin: 0 auto 28px;
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    h1 em {
      font-style: italic;
      color: var(--terracotta);
    }
    p {
      margin: 20px 0 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(244, 240, 231, 0.55);
    }
    a {
      color: rgba(244, 240, 231, 0.7);
      text-decoration: none;
      border-bottom: 1px solid rgba(217, 138, 106, 0.45);
      transition: color 0.2s;
    }
    a:hover { color: var(--cream); }
  </style>
</head>
<body>
  <img class="wordmark" src="images/brand/logo-wordmark-reversed.svg" alt="GameChanger" width="240" height="40">
  <div class="rule" aria-hidden="true"></div>
  <h1>Coming <em>soon.</em></h1>
  <p>Site temporarily unavailable</p>
</body>
</html>
